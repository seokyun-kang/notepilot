name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag must match the package version
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import notepilot; print(notepilot.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - run: python -m unittest discover -s tests
      - run: python -m pip install build && python -m build
      - name: Release notes from CHANGELOG.md
        run: |
          python - <<'EOF'
          import os, re
          version = os.environ['GITHUB_REF_NAME'][1:]
          text = open('CHANGELOG.md', encoding='utf-8').read()
          match = re.search(r'^## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=^## |^\[)', text, re.S | re.M)
          if not match:
              raise SystemExit('CHANGELOG.md has no section for ' + version)
          open('notes.md', 'w', encoding='utf-8').write(match[1].strip() + '\n')
          EOF
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
